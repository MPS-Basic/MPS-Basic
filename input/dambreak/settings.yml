computationalConditions:
    dim: 2
    particleDistance: 0.025
    dt: 0.001
    endTime: 2.0
    outputPeriod: 0.04
    cflCondition: 0.3

domain:
    min: [-0.1, -0.1, 0.0]
    max: [1.1, 2.0, 0.0]

physicalProperties:
    defaultDensity: 1000.0 # If the particle density is not specified, this value is used.
    kinematicViscosity: 1.0e-06 # If not written to the first decimal place, it may be recognized as a string.

gravity:
    method: xyz # xyz or normAndAngle
    xyz: [0.0, -9.8, 0.0]
    normAndAngle: # in XY plane ONLY
        norm: 9.8
        angle: 0 # in degrees, counter-clockwise from -Y direction

surfaceDetection:
    numberDensity:
        threshold: 0.97 # threshold ratio of the number density
    particleDistribution:
        enabled: true
        threshold: 1.0

pressureCalculation:
    method: Implicit # Implicit or Explicit
    implicit:
        compressibility: 0.45e-09
        relaxationCoefficient: 0.2
    explicit:
        soundSpeed: 17.1

collision:
    distanceRatio: 0.5
    coefficientOfRestitution: 0.2

effectiveRadius:
    ratioForNumberDensity: 3.1
    ratioForGradient: 2.1
    ratioForLaplacian: 3.1

io:
    particlesPath: ./input.prof # relative path from the directory where this file is located
    outputVtkInBinary: true # ascii or binary (if is not specified, false)